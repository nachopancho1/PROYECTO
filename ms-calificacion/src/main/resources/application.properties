spring.application.name=ms-calificacion
server.port=8088

# Conexión automática para db_calificaciones
spring.datasource.url=jdbc:mysql://localhost:3306/db_calificaciones?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- CONFIGURACIÓN DE SWAGGER CORREGIDA ---
springdoc.swagger-ui.enabled=true
# RUTA LIMPIA: El Gateway la encuentra aquí gracias al RewritePath
springdoc.api-docs.path=/v3/api-docs

# --- CONFIGURACIÓN DE CORS ---
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*