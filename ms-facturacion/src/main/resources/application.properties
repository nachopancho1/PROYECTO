spring.application.name=ms-facturacion
server.port=8090

# Conexión automática para db_facturacion
spring.datasource.url=jdbc:mysql://localhost:3306/db_facturacion?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- CONFIGURACIÓN DE SWAGGER CORREGIDA ---
springdoc.swagger-ui.enabled=true
# ¡ESTO ES LO QUE HACE QUE EL GATEWAY FUNCIONE!
springdoc.api-docs.path=/v3/api-docs

# --- CONFIGURACIÓN DE CORS ---
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*