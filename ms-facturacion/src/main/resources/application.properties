server.port=8090
spring.application.name=ms-facturacion

spring.datasource.url=jdbc:mysql://localhost:3306/db_facturacion?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- CONFIGURACIÓN DE SWAGGER (AGREGA ESTO) ---
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api/facturas/v3/api-docs