spring.application.name=ms-productos
server.port=8081

# Agregado el parámetro para que XAMPP cree la base de datos db_productos automáticamente
spring.datasource.url=jdbc:mysql://localhost:3306/db_productos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- CONFIGURACIÓN DE SWAGGER CORREGIDA ---
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs