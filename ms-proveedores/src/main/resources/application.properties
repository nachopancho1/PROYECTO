spring.application.name=ms-proveedores
server.port=8083

# Conexión automática a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/db_proveedores?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Configuración Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Swagger limpia para el Gateway
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs

# Configuración CORS
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*