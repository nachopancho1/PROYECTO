spring.application.name=ms-soporte

server.port=8086

# Agregado el parámetro al final (?createDatabaseIfNotExist=true) para que autocree la base de datos en XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/db_soporte?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Configuración JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect