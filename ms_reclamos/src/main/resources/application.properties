spring.application.name=ms-reclamos
server.port=8087

# Parámetro de auto-creación para db_reclamos si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/db_reclamos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Configuración JPA e Hibernate estándar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- CONFIGURACIÓN DE SWAGGER CORREGIDA ---
springdoc.swagger-ui.enabled=true
# ¡Aquí está el truco! Lo dejamos en la ruta nativa para el puente del Gateway
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha

# --- CONFIGURACIÓN DE CORS GLOBAL ---
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*