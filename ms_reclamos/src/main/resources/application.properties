spring.application.name=ms-reclamos
server.port=8087

# Agregado el parámetro (?createDatabaseIfNotExist=true) para evitar errores si no has creado la BD a mano
spring.datasource.url=jdbc:mysql://localhost:3306/db_reclamos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Configuración JPA e Hibernate estándar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- CONFIGURACIÓN DE SWAGGER (CORREGIDA PARA EL GATEWAY) ---
# Cambiado a true para que el Gateway (9090) pueda succionar la documentación sin bloquearse
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api/reclamos/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha

# --- CONFIGURACIÓN DE CORS GLOBAL ---
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*